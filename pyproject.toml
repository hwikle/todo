[project]
name = "daily-todo"
version = "0.1.0"
description = "A local, version-controlled daily TODO workflow"
requires-python = ">=3.9"
dependencies = [
    "jsonschema>=4,<5",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11,<2",
    "types-jsonschema>=4,<5",
]

[tool.mypy]
python_version = "3.9"
files = ["lib", "tests"]
strict = true
show_error_codes = true
pretty = true
